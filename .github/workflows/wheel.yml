name: Build PyICU wheels for Windows

on:
  workflow_dispatch:

env:
  PYICU_TAG: v2.16.2
  PYICU_VER: 2.16.2
  ICU_VERSION: 78
  ICU_RELEASE: 78.3/icu4c-78.3
  CIBW_TEST_REQUIRES: pytest six
  CIBW_TEST_COMMAND: pytest {project}/test
  CIBW_SKIP: "cp39* cp310* cp311*"
  CIBW_REPAIR_WHEEL_COMMAND: ""

jobs:
  build_amd64:
    name: Build AMD64 wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
    env:
      ICU_ARCH: 64
      ICU_PLAT: Win64-MSVC2022
    steps:
      - uses: actions/checkout@v7
      - run: download.cmd
        shell: cmd
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT_WINDOWS: INCLUDE="include;$INCLUDE" LIB="lib$ICU_ARCH;$LIB"
      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: wheels-win-amd64
  build_arm64:
    name: Build ARM64 wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
    env:
      ICU_ARCH: ARM64
      ICU_PLAT: WinARM64-MSVC2022
    steps:
      - uses: actions/checkout@v7
      - run: download.cmd
        shell: cmd
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS_WINDOWS: ARM64
          CIBW_ENVIRONMENT_WINDOWS: INCLUDE="include;$INCLUDE" LIB="lib$ICU_ARCH;$LIB"
      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: wheels-win-arm64
  build_x86:
    name: Build x86 wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
    env:
      ICU_PLAT: Win32-MSVC2022
    steps:
      - uses: actions/checkout@v7
      - run: download.cmd
        shell: cmd
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS_WINDOWS: x86
          CIBW_ENVIRONMENT_WINDOWS: INCLUDE="include;$INCLUDE" LIB="lib;$LIB"
      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: wheels-win32
